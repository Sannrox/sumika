name: Bug report
description: Report reproducible incorrect behavior in sumika.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, tokens, or session contents you would not paste in public.
        Report exploitable vulnerabilities through the private security link instead.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Smallest commands needed to reproduce.
      placeholder: |
        1. `sumika daemon`
        2. `sumika start demo -- bash`
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: git SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Rust version, and `SUMIKA_SOCK` if you set it.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or diagnostics
      description: Remove secrets and session contents before submitting.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I removed credentials, tokens, and sensitive session contents.
          required: true
        - label: This is not an exploitable security vulnerability.
          required: true
